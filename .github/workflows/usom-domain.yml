name: USOM Domain Feed

on:
  schedule:
    - cron: "10 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-domain-feed:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Fetch USOM Domain list
        run: |
          python scripts/update_edl.py --type domain --output feeds/domain.txt

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update USOM Domain feed"
          file_pattern: feeds/domain.txt
