name: USOM IP Feed

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ip-feed:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Fetch USOM IP list
        run: |
          python scripts/update_edl.py --type ip --output feeds/ip.txt

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update USOM IP feed"
          file_pattern: feeds/ip.txt
